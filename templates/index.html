<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タイマー & ストップウォッチ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="container">
        <h1>タイマー & ストップウォッチ</h1>

        <!-- タブ切り替え -->
        <div class="tab-container">
            <button class="tab-link active" onclick="openTab(event, 'timer')">タイマー</button>
            <button class="tab-link" onclick="openTab(event, 'stopwatch')">ストップウォッチ</button>
        </div>

        <!-- タイマー機能 -->
        <div id="timer" class="tab-content active">
            <div class="timer-display">
                <span id="timer-hours">00</span>:<span id="timer-minutes">00</span>:<span id="timer-seconds">00</span>
            </div>
            <div class="timer-inputs">
                <div class="input-group">
                    <label for="hours">時間</label>
                    <input type="number" id="hours" min="0" max="99" value="0">
                </div>
                <div class="input-group">
                    <label for="minutes">分</label>
                    <input type="number" id="minutes" min="0" max="59" value="0">
                </div>
                <div class="input-group">
                    <label for="seconds">秒</label>
                    <input type="number" id="seconds" min="0" max="59" value="0">
                </div>
            </div>
             <div class="timer-controls">
                <button id="start-timer">スタート</button>
                <button id="stop-timer">ストップ</button>
                <button id="reset-timer">リセット</button>
                <div class="advanced-mode">
                    <label>
                        <input type="checkbox" id="advanced-toggle">
                        拡張
                    </label>
                    <div id="advanced-buttons" class="hidden">
                        <button id="add-1-min">+1分</button>
                        <button id="add-3-min">+3分</button>
                        <button id="add-5-min">+5分</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ストップウォッチ機能 -->
        <div id="stopwatch" class="tab-content">
            <h2>ストップウォッチ</h2>
            <div class="stopwatch-display">
                <span id="stopwatch-hours">00</span>:<span id="stopwatch-minutes">00</span>:<span id="stopwatch-seconds">00</span>.<span id="stopwatch-milliseconds">00</span>
            </div>
            <div class="stopwatch-controls">
                <button id="start-stopwatch">スタート</button>
                <button id="pause-stopwatch">一時停止</button>
                <button id="reset-stopwatch">リセット</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
